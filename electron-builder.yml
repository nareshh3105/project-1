appId: com.codebuilders.desktop
productName: CodeBuilders
copyright: Copyright © 2026 CodeBuilders

directories:
  # Override with -c.directories.output=<path> when a security product holds a
  # lock inside this tree; see scripts/PACKAGING.md.
  output: release/${version}
  buildResources: build

files:
  - out/**/*
  - package.json
  - '!**/*.map'

# FFmpeg is shipped beside the app so recording, streaming, the replay buffer
# and the virtual camera work without the user installing anything. The binary
# is not in git; scripts/fetch-ffmpeg.ps1 puts it in resources/ffmpeg first.
extraResources:
  - from: resources/ffmpeg
    to: ffmpeg
    filter:
      - ffmpeg.exe
      - LICENSE*
  # The virtual camera: the DLL Windows loads, the program that creates the camera,
  # and the scripts that install it. Built by native/vcam/build.cmd and kept in git,
  # so building the app does not need a C++ compiler.
  - from: resources/vcam
    to: vcam

# better-sqlite3 ships a compiled .node binding that cannot be bundled by the
# renderer build, so it is unpacked from the asar and loaded from disk.
asarUnpack:
  - '**/node_modules/better-sqlite3/**'

win:
  target:
    - target: nsis
      arch: [x64]
    - target: msi
      arch: [x64]
  artifactName: ${productName}_${version}_${arch}-setup.${ext}
  # Signing is applied by passing the certificate through the environment at
  # build time; see scripts/SIGNING.md. Unsigned builds still produce
  # installers, but Windows will warn the user that the publisher is unknown.

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: CodeBuilders

publish:
  provider: github
  owner: nareshh3105
  repo: project-1
